name: iOS Cache Seed

env:
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true

on:
    push:
        branches:
            - main
        paths:
            - ".github/workflows/android-ci.yml"
            - ".github/workflows/ios-cache-seed.yml"
            - "build-logic/**"
            - "composeApp/**"
            - "core/**"
            - "fastlane/scripts/prepare_cached_kmp_frameworks.rb"
            - "feature/**"
            - "gradle/**"
            - "iosApp/**"
            - "iosWidgetShared/**"
            - "*.gradle.kts"
            - "gradle.properties"
            - "settings.gradle.kts"
    workflow_dispatch:

concurrency:
    group: ios-cache-seed-main
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ios-cache-seed:
        name: Seed iOS caches from main
        if: github.ref == 'refs/heads/main'
        runs-on: macos-latest
        timeout-minutes: 60
        env:
            IOS_DERIVED_DATA_PATH: ${{ github.workspace }}/build/ios-derived-data

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup JDK 21
                uses: actions/setup-java@v5
                with:
                    distribution: zulu
                    java-version: 21

            -   name: Setup Android SDK
                uses: android-actions/setup-android@v4
                with:
                    packages: platform-tools

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    cache-read-only: false

            -   name: Read Xcode cache version
                id: xcode-version
                run: |
                    xcodebuild -version
                    printf 'hash=%s\n' "$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

            -   name: Restore iOS dependency cache
                id: ios-dependency-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        ~/.konan
                        ${{ env.IOS_DERIVED_DATA_PATH }}/SourcePackages
                    key: ios-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('iosApp/**/Package.resolved', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
                    restore-keys: |
                        ios-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-

            -   name: Restore iOS build cache
                id: ios-build-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        ${{ env.IOS_DERIVED_DATA_PATH }}/Build
                        ${{ env.IOS_DERIVED_DATA_PATH }}/ModuleCache.noindex
                        ${{ env.IOS_DERIVED_DATA_PATH }}/SDKStatCaches.noindex
                    key: ios-xcode-simulator-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('iosApp/**', 'iosWidgetShared/**', 'composeApp/**', 'core/**', 'feature/**', 'build-logic/**', '*.gradle.kts', 'gradle/**') }}
                    restore-keys: |
                        ios-xcode-simulator-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-

            -   name: Restore KMP framework cache
                id: kmp-framework-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        composeApp/build/xcode-frameworks/Release
                        iosWidgetShared/build/xcode-frameworks/Release
                        ${{ env.IOS_DERIVED_DATA_PATH }}/Build/Products/Release-iphonesimulator/ComposeApp.framework
                        ${{ env.IOS_DERIVED_DATA_PATH }}/Build/Products/Release-iphonesimulator/IosWidgetShared.framework
                    key: ios-kmp-frameworks-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('iosWidgetShared/**', 'composeApp/**', 'core/**', 'feature/**', 'build-logic/**', '*.gradle.kts', 'gradle/**', 'gradle.properties') }}

            -   name: Reuse cached Kotlin frameworks
                if: steps.kmp-framework-cache.outputs.cache-hit == 'true'
                run: ruby fastlane/scripts/prepare_cached_kmp_frameworks.rb iosApp/iosApp.xcodeproj/project.pbxproj

            -   name: Generate build properties
                env:
                    SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
                    STORE_FILE: ${{ secrets.STORE_FILE }}
                    STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    printf 'SERVER_BASE_URL=%s\n' "$SERVER_BASE_URL" > secrets.properties
                    printf 'STORE_FILE=%s\n' "$STORE_FILE" > keystore.properties
                    printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> keystore.properties
                    printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS" >> keystore.properties
                    printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> keystore.properties

            -   name: Build iOS cache seed
                run: |
                    printf 'IOS_BUILD_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
                    set -o pipefail
                    xcodebuild \
                        -project iosApp/iosApp.xcodeproj \
                        -scheme iosApp \
                        -configuration Release \
                        -sdk iphonesimulator \
                        -destination "generic/platform=iOS Simulator" \
                        -derivedDataPath "$IOS_DERIVED_DATA_PATH" \
                        -showBuildTimingSummary \
                        ARCHS=arm64 \
                        ONLY_ACTIVE_ARCH=YES \
                        CODE_SIGNING_ALLOWED=NO \
                        OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED="${{ steps.kmp-framework-cache.outputs.cache-hit == 'true' && 'YES' || 'NO' }}" \
                        build 2>&1 | tee "$RUNNER_TEMP/ios-cache-seed.log"

            -   name: Verify cache seed products
                run: |
                    test -d "$IOS_DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/ComposeApp.framework"
                    test -d "$IOS_DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/IosWidgetShared.framework"
                    test -d "$IOS_DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/iosApp.app"

            -   name: Report iOS cache seed performance
                if: always()
                env:
                    DEPENDENCY_CACHE_HIT: ${{ steps.ios-dependency-cache.outputs.cache-hit }}
                    DEPENDENCY_CACHE_KEY: ${{ steps.ios-dependency-cache.outputs.cache-matched-key }}
                    BUILD_CACHE_HIT: ${{ steps.ios-build-cache.outputs.cache-hit }}
                    BUILD_CACHE_KEY: ${{ steps.ios-build-cache.outputs.cache-matched-key }}
                    KMP_CACHE_HIT: ${{ steps.kmp-framework-cache.outputs.cache-hit }}
                    KMP_CACHE_KEY: ${{ steps.kmp-framework-cache.outputs.cache-matched-key }}
                run: |
                    cache_state() {
                        if test "$1" = "true"; then
                            printf 'exact hit'
                        elif test -n "$2"; then
                            printf 'fallback hit'
                        else
                            printf 'miss'
                        fi
                    }
                    if test -n "${IOS_BUILD_STARTED:-}"; then
                        ELAPSED_SECONDS=$(($(date +%s) - IOS_BUILD_STARTED))
                        ELAPSED_LABEL=$(printf '%dm %02ds' "$((ELAPSED_SECONDS / 60))" "$((ELAPSED_SECONDS % 60))")
                    else
                        ELAPSED_LABEL='not started'
                    fi
                    {
                        printf '## iOS main cache seed\n'
                        printf -- '- Elapsed: `%s`\n' "$ELAPSED_LABEL"
                        printf -- '- Dependencies: `%s`\n' "$(cache_state "$DEPENDENCY_CACHE_HIT" "$DEPENDENCY_CACHE_KEY")"
                        printf -- '- Build intermediates: `%s`\n' "$(cache_state "$BUILD_CACHE_HIT" "$BUILD_CACHE_KEY")"
                        printf -- '- KMP frameworks: `%s`\n' "$(cache_state "$KMP_CACHE_HIT" "$KMP_CACHE_KEY")"
                        if test -f "$RUNNER_TEMP/ios-cache-seed.log"; then
                            printf '\n```text\n'
                            sed -n '/Build Timing Summary/,$p' "$RUNNER_TEMP/ios-cache-seed.log" | head -40
                            printf '```\n'
                        fi
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Save iOS dependency cache
                if: ${{ success() && steps.ios-dependency-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        ~/.konan
                        ${{ env.IOS_DERIVED_DATA_PATH }}/SourcePackages
                    key: ${{ steps.ios-dependency-cache.outputs.cache-primary-key }}

            -   name: Save iOS build cache
                if: ${{ success() && steps.ios-build-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        ${{ env.IOS_DERIVED_DATA_PATH }}/Build
                        ${{ env.IOS_DERIVED_DATA_PATH }}/ModuleCache.noindex
                        ${{ env.IOS_DERIVED_DATA_PATH }}/SDKStatCaches.noindex
                    key: ${{ steps.ios-build-cache.outputs.cache-primary-key }}

            -   name: Save KMP framework cache
                if: ${{ success() && steps.kmp-framework-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        composeApp/build/xcode-frameworks/Release
                        iosWidgetShared/build/xcode-frameworks/Release
                        ${{ env.IOS_DERIVED_DATA_PATH }}/Build/Products/Release-iphonesimulator/ComposeApp.framework
                        ${{ env.IOS_DERIVED_DATA_PATH }}/Build/Products/Release-iphonesimulator/IosWidgetShared.framework
                    key: ${{ steps.kmp-framework-cache.outputs.cache-primary-key }}
