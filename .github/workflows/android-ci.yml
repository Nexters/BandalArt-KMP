name: Android CI

env:
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true

on:
    pull_request:
        paths-ignore:
            - "**/*.md"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        name: Detect iOS changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
        outputs:
            ios: ${{ steps.ios.outputs.changed }}

        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Detect iOS build inputs
                id: ios
                env:
                    BASE_SHA: ${{ github.event.pull_request.base.sha }}
                    HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                run: |
                    set +e
                    git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
                        .github/workflows/android-ci.yml \
                        build-logic \
                        composeApp \
                        core \
                        feature \
                        gradle \
                        iosApp \
                        iosWidgetShared \
                        build.gradle.kts \
                        gradle.properties \
                        settings.gradle.kts
                    DIFF_STATUS=$?
                    set -e
                    case "$DIFF_STATUS" in
                        0) IOS_CHANGED=false ;;
                        1) IOS_CHANGED=true ;;
                        *) exit "$DIFF_STATUS" ;;
                    esac
                    printf 'changed=%s\n' "$IOS_CHANGED" >> "$GITHUB_OUTPUT"
                    printf '## iOS change detection\n- Build required: `%s`\n' "$IOS_CHANGED" >> "$GITHUB_STEP_SUMMARY"

    quality:
        name: Code quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}

        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Setup JDK 21
                uses: actions/setup-java@v5
                with:
                    distribution: zulu
                    java-version: 21

            -   name: Setup Android SDK
                uses: android-actions/setup-android@v4
                with:
                    packages: platform-tools

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Generate build properties
                env:
                    SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
                    STORE_FILE: ${{ secrets.STORE_FILE }}
                    STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    printf 'SERVER_BASE_URL=%s\n' "$SERVER_BASE_URL" > secrets.properties
                    printf 'STORE_FILE=%s\n' "$STORE_FILE" > keystore.properties
                    printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> keystore.properties
                    printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS" >> keystore.properties
                    printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> keystore.properties

            -   name: Run static analysis
                run: ./gradlew spotlessCheck detekt -PspotlessRatchetFrom=origin/main --stacktrace

    unit_tests:
        name: Unit tests
        runs-on: macos-latest
        timeout-minutes: 30
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup JDK 21
                uses: actions/setup-java@v5
                with:
                    distribution: zulu
                    java-version: 21

            -   name: Setup Android SDK
                uses: android-actions/setup-android@v4
                with:
                    packages: platform-tools

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Generate build properties
                env:
                    SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
                    STORE_FILE: ${{ secrets.STORE_FILE }}
                    STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    printf 'SERVER_BASE_URL=%s\n' "$SERVER_BASE_URL" > secrets.properties
                    printf 'STORE_FILE=%s\n' "$STORE_FILE" > keystore.properties
                    printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> keystore.properties
                    printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS" >> keystore.properties
                    printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> keystore.properties

            -   name: Run unit tests
                run: ./gradlew allTests :androidApp:testDebugUnitTest --stacktrace

    android:
        name: Android lint and build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup JDK 21
                uses: actions/setup-java@v5
                with:
                    distribution: zulu
                    java-version: 21

            -   name: Setup Android SDK
                uses: android-actions/setup-android@v4
                with:
                    packages: platform-tools

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Generate build properties
                env:
                    SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
                    STORE_FILE: ${{ secrets.STORE_FILE }}
                    STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    printf 'SERVER_BASE_URL=%s\n' "$SERVER_BASE_URL" > secrets.properties
                    printf 'STORE_FILE=%s\n' "$STORE_FILE" > keystore.properties
                    printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> keystore.properties
                    printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS" >> keystore.properties
                    printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> keystore.properties

            -   name: Run Android lint and build
                run: ./gradlew :androidApp:lintDebug :androidApp:assembleDebug --stacktrace

    ios:
        name: iOS host app build
        needs: changes
        runs-on: macos-latest
        timeout-minutes: 60
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') && needs.changes.outputs.ios == 'true' }}
        env:
            IOS_DERIVED_DATA_PATH: ${{ github.workspace }}/build/ios-derived-data

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup JDK 21
                uses: actions/setup-java@v5
                with:
                    distribution: zulu
                    java-version: 21

            -   name: Setup Android SDK
                uses: android-actions/setup-android@v4
                with:
                    packages: platform-tools

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    # PR reruns must be able to reuse Kotlin/Native task outputs.
                    cache-read-only: false

            -   name: Read Xcode cache version
                id: xcode-version
                run: |
                    xcodebuild -version
                    printf 'hash=%s\n' "$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

            -   name: Restore iOS dependency cache
                id: ios-dependency-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        ~/.konan
                        ${{ env.IOS_DERIVED_DATA_PATH }}/SourcePackages
                    key: ios-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('iosApp/**/Package.resolved', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
                    restore-keys: |
                        ios-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-

            -   name: Restore iOS build cache
                id: ios-build-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        ${{ env.IOS_DERIVED_DATA_PATH }}/Build
                        ${{ env.IOS_DERIVED_DATA_PATH }}/ModuleCache.noindex
                        ${{ env.IOS_DERIVED_DATA_PATH }}/SDKStatCaches.noindex
                    key: ios-simulator-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('iosApp/**', 'iosWidgetShared/**', 'composeApp/**', 'core/**', 'feature/**', 'build-logic/**', '*.gradle.kts', 'gradle/**') }}
                    restore-keys: |
                        ios-simulator-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-

            -   name: Generate build properties
                env:
                    SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
                    STORE_FILE: ${{ secrets.STORE_FILE }}
                    STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    printf 'SERVER_BASE_URL=%s\n' "$SERVER_BASE_URL" > secrets.properties
                    printf 'STORE_FILE=%s\n' "$STORE_FILE" > keystore.properties
                    printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> keystore.properties
                    printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS" >> keystore.properties
                    printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> keystore.properties

            -   name: Boot iOS simulator
                run: |
                    SIMULATOR_UDID="$(
                        xcrun simctl list devices available -j |
                            jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid'
                    )"
                    test -n "$SIMULATOR_UDID"
                    test "$SIMULATOR_UDID" != "null"
                    xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
                    xcrun simctl bootstatus "$SIMULATOR_UDID" -b
                    printf 'SIMULATOR_UDID=%s\n' "$SIMULATOR_UDID" >> "$GITHUB_ENV"

            -   name: Build iOS host app
                run: |
                    printf 'IOS_BUILD_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
                    set -o pipefail
                    xcodebuild \
                        -project iosApp/iosApp.xcodeproj \
                        -scheme iosApp \
                        -configuration Release \
                        -sdk iphonesimulator \
                        -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
                        -derivedDataPath "$IOS_DERIVED_DATA_PATH" \
                        -showBuildTimingSummary \
                        ARCHS=arm64 \
                        CODE_SIGNING_ALLOWED=NO \
                        build 2>&1 | tee "$RUNNER_TEMP/ios-xcodebuild.log"

            -   name: Report iOS build performance
                if: always()
                env:
                    DEPENDENCY_CACHE_HIT: ${{ steps.ios-dependency-cache.outputs.cache-hit }}
                    DEPENDENCY_CACHE_KEY: ${{ steps.ios-dependency-cache.outputs.cache-matched-key }}
                    BUILD_CACHE_HIT: ${{ steps.ios-build-cache.outputs.cache-hit }}
                    BUILD_CACHE_KEY: ${{ steps.ios-build-cache.outputs.cache-matched-key }}
                run: |
                    cache_state() {
                        if test "$1" = "true"; then
                            printf 'exact hit'
                        elif test -n "$2"; then
                            printf 'fallback hit'
                        else
                            printf 'miss'
                        fi
                    }
                    if test -n "${IOS_BUILD_STARTED:-}"; then
                        ELAPSED_SECONDS=$(($(date +%s) - IOS_BUILD_STARTED))
                        ELAPSED_LABEL=$(printf '%dm %02ds' "$((ELAPSED_SECONDS / 60))" "$((ELAPSED_SECONDS % 60))")
                    else
                        ELAPSED_LABEL='not started'
                    fi
                    {
                        printf '## iOS build performance\n'
                        printf -- '- Elapsed: `%s`\n' "$ELAPSED_LABEL"
                        printf -- '- Dependencies: `%s`\n' "$(cache_state "$DEPENDENCY_CACHE_HIT" "$DEPENDENCY_CACHE_KEY")"
                        printf -- '- Build intermediates: `%s`\n' "$(cache_state "$BUILD_CACHE_HIT" "$BUILD_CACHE_KEY")"
                        if test -f "$RUNNER_TEMP/ios-xcodebuild.log"; then
                            printf '\n```text\n'
                            sed -n '/Build Timing Summary/,$p' "$RUNNER_TEMP/ios-xcodebuild.log" | head -40
                            printf '```\n'
                        fi
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Verify notification localizations
                run: |
                    APP_BUNDLE="$IOS_DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/iosApp.app"
                    test -d "$APP_BUNDLE"
                    for locale in en ja ko; do
                        test -f "$APP_BUNDLE/$locale.lproj/Localizable.strings"
                    done

            -   name: Launch iOS app
                run: |
                    APP_BUNDLE="$IOS_DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/iosApp.app"
                    xcrun simctl install "$SIMULATOR_UDID" "$APP_BUNDLE"
                    LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.nexters.bandalart.iosApp)"
                    APP_PID="${LAUNCH_OUTPUT##*: }"
                    for _ in {1..45}; do
                        kill -0 "$APP_PID"
                        sleep 1
                    done
                    xcrun simctl terminate "$SIMULATOR_UDID" com.nexters.bandalart.iosApp

            -   name: Save iOS dependency cache
                if: ${{ success() && steps.ios-dependency-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        ~/.konan
                        ${{ env.IOS_DERIVED_DATA_PATH }}/SourcePackages
                    key: ${{ steps.ios-dependency-cache.outputs.cache-primary-key }}

            -   name: Save iOS build cache
                if: ${{ success() && steps.ios-build-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
                with:
                    path: |
                        ${{ env.IOS_DERIVED_DATA_PATH }}/Build
                        ${{ env.IOS_DERIVED_DATA_PATH }}/ModuleCache.noindex
                        ${{ env.IOS_DERIVED_DATA_PATH }}/SDKStatCaches.noindex
                    key: ${{ steps.ios-build-cache.outputs.cache-primary-key }}

    release_cd:
        name: Release CD validation
        runs-on: macos-latest
        timeout-minutes: 15
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}

        steps:
            -   uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            -   name: Setup Ruby
                uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
                with:
                    bundler-cache: true

            -   name: Install pinned actionlint
                run: |
                    set -euo pipefail
                    case "$(uname -m)" in
                        arm64)
                            ACTIONLINT_ARCHIVE=actionlint_1.7.7_darwin_arm64.tar.gz
                            ACTIONLINT_SHA256=2693315b9093aeacb4ebd91a993fea54fc215057bf0da2659056b4bc033873db
                            ;;
                        x86_64)
                            ACTIONLINT_ARCHIVE=actionlint_1.7.7_darwin_amd64.tar.gz
                            ACTIONLINT_SHA256=28e5de5a05fc558474f638323d736d822fff183d2d492f0aecb2b73cc44584f5
                            ;;
                        *)
                            echo "Unsupported runner architecture" >&2
                            exit 1
                            ;;
                    esac
                    curl --fail --silent --show-error --location \
                        "https://github.com/rhysd/actionlint/releases/download/v1.7.7/$ACTIONLINT_ARCHIVE" \
                        --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE"
                    printf '%s  %s\n' \
                        "$ACTIONLINT_SHA256" \
                        "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | shasum -a 256 --check
                    tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint

            -   name: Run release CD validation
                run: |
                    "$RUNNER_TEMP/actionlint" \
                        .github/workflows/android-ci.yml \
                        .github/workflows/play-store-screenshots.yml \
                        .github/workflows/release-cd.yml
                    bundle exec ruby fastlane/test/app_store_connect_builds_test.rb
                    bundle exec ruby fastlane/test/plist_file_test.rb
                    bundle exec ruby fastlane/test/provisioning_profile_test.rb
                    bundle exec ruby fastlane/test/signing_configuration_test.rb
                    bundle exec ruby fastlane/test/testflight_test_ads_test.rb
                    bundle exec ruby fastlane/test/ios_ci_cache_test.rb
                    bundle exec ruby fastlane/test/android_update_priority_test.rb
                    python3 -m unittest scripts.tests.test_play_release_scripts
                    python3 -m unittest scripts.tests.test_play_screenshot_upload
                    bundle exec fastlane lanes
                    xmllint --noout iosApp/iosApp.xcodeproj/xcshareddata/xcschemes/iosApp.xcscheme

    ci-build:
        name: ci-build
        runs-on: ubuntu-latest
        if: ${{ always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
        needs:
            - changes
            - quality
            - unit_tests
            - android
            - ios
            - release_cd

        steps:
            -   name: Verify required jobs
                env:
                    QUALITY_RESULT: ${{ needs.quality.result }}
                    UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
                    ANDROID_RESULT: ${{ needs.android.result }}
                    IOS_RESULT: ${{ needs.ios.result }}
                    RELEASE_CD_RESULT: ${{ needs.release_cd.result }}
                    CHANGES_RESULT: ${{ needs.changes.result }}
                run: |
                    test "$CHANGES_RESULT" = "success"
                    test "$QUALITY_RESULT" = "success"
                    test "$UNIT_TESTS_RESULT" = "success"
                    test "$ANDROID_RESULT" = "success"
                    case "$IOS_RESULT" in
                        success|skipped) ;;
                        *) exit 1 ;;
                    esac
                    test "$RELEASE_CD_RESULT" = "success"
